[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gitlord"
version = "0.2.0"
description = "Agent orchestration framework with git-backed storage"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Yashneil Gajjala", email = "yashneil75@gmail.com"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
keywords = [
    "git",
    "agent",
    "orchestration",
    "ai",
    "mcp",
    "litellm",
    "chromadb",
    "rag",
    "rewindable",
    "session",
]
dependencies = [
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://github.com/yashneil75/gitlord"
Repository = "https://github.com/yashneil75/gitlord"
Issues = "https://github.com/yashneil75/gitlord/issues"

[project.optional-dependencies]
all = [
    "litellm>=1.40",
    "chromadb>=0.5",
    "typer>=0.9",
    "ulid-py>=1.1",
    "tiktoken>=0.7",
    "mcp>=1.27",
]
mcp = ["mcp>=1.27"]
litellm = ["litellm>=1.40"]
chromadb = ["chromadb>=0.5"]
cli = ["typer>=0.9"]
ulid = ["ulid-py>=1.1"]

[project.scripts]
gitlord = "gitlord.cli:main"

[tool.setuptools.packages.find]
include = ["gitlord*"]
