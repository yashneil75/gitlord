[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "gitlord"
version = "0.1.0"
description = "Agent orchestration framework with git-backed storage"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
all = [
    "litellm>=1.40",
    "chromadb>=0.5",
    "typer>=0.9",
    "ulid-py>=1.1",
]
litellm = ["litellm>=1.40"]
chromadb = ["chromadb>=0.5"]
cli = ["typer>=0.9"]
ulid = ["ulid-py>=1.1"]

[project.scripts]
gitlord = "gitlord.cli:main"

[tool.setuptools.packages.find]
include = ["gitlord*"]
